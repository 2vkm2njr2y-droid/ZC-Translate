[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::DeprecationWarning:fastapi.testclient",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["vendor", "models", "data", "tests/manual", ".venv-runtime", ".venv-convert"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B904"]
